<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Caddy Vault — Chrome Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:      #0A080F;
      --white:      #FDFCFF;
      --gold:       #B8960C;
      --text:       #0A080F;
      --text-muted: #7A7490;
      --border:     rgba(10, 8, 15, 0.1);
      --font:       'EB Garamond', 'Garamond', 'Times New Roman', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      font-size: 18px;
      line-height: 1.7;
      color: var(--text);
      background-color: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    em { font-style: italic; }
    code {
      background: rgba(10, 8, 15, 0.05);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 0.95em;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 32px;
    }

    .nav {
      background: rgba(253, 252, 255, 0.92);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      text-align: center;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: 500;
      color: var(--black);
    }

    .nav-logo em {
      color: var(--gold);
    }

    h1 {
      font-size: 42px;
      font-weight: 500;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .hero-sub {
      font-size: 20px;
      color: var(--text-muted);
      margin-bottom: 48px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin-bottom: 60px;
    }

    .step {
      display: flex;
      gap: 24px;
    }

    .step-num {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 18px;
    }

    .step-content h2 {
      font-size: 24px;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .step-content p {
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .code-block {
      background: var(--black);
      color: #d4af37;
      padding: 16px 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 15px;
      line-height: 1.5;
      margin-top: 12px;
      overflow-x: auto;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 6px;
      border: 1px solid;
      font-family: var(--font);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      display: inline-block;
    }

    .btn-primary {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .btn-primary:hover {
      opacity: 0.85;
    }

    .btn-secondary {
      background: transparent;
      color: var(--black);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--black);
    }

    .tip {
      background: rgba(184, 150, 12, 0.08);
      border-left: 3px solid var(--gold);
      padding: 16px 20px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 16px;
    }

    .tip strong {
      color: var(--black);
    }

    .footer {
      border-top: 1px solid var(--border);
      padding-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      .step { gap: 16px; }
      .container { padding: 40px 20px; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <div class="nav-logo">Caddy <em>Vault</em></div>
  </div>

  <div class="container">

    <h1>Get Caddy Vault</h1>
    <p class="hero-sub">One click. No setup. No ZIP files.</p>

    <div style="text-align: center; padding: 60px 0 48px;">
      <a href="https://chromewebstore.google.com/detail/cnccbejnbghlafnobeefoljgocfjikmf" class="btn btn-primary" target="_blank" rel="noopener" style="font-size: 20px; padding: 18px 40px;">Add to Chrome — it's free</a>
      <p style="margin-top: 20px; color: var(--text-muted); font-size: 15px;">Free &nbsp;·&nbsp; No account &nbsp;·&nbsp; Data never leaves your browser</p>
    </div>

    <div class="footer">
      <p>Caddy Vault is free and open source · Available on the Chrome Web Store</p>
    </div>

  </div>

</body>
</html>
